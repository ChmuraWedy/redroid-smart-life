name: Publish controller image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency: publish-controller

env:
  IMAGE: ghcr.io/chmurawedy/redroid-smart-life-controller

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Sign in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build and push the commit tag
        run: |
          docker buildx build --file Dockerfile.controller \
            --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$IMAGE:$GITHUB_SHA" --push .
      - name: Verify both images from GHCR
        run: |
          for platform in linux/amd64 linux/arm64; do
            docker pull --platform "$platform" "$IMAGE:$GITHUB_SHA"
            docker run --rm --network none --platform "$platform" --entrypoint sh "$IMAGE:$GITHUB_SHA" -ec '
              adb version
              python -c "from controller_api import app, health; assert health() == {\"status\": \"ready\"}; assert \"/v1/android/wake\" in app.openapi()[\"paths\"]"
            '
          done
      - name: Publish the verified image as latest
        run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$GITHUB_SHA"
